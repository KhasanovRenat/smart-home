apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: smart-home-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 3000, targetPort: http}]
