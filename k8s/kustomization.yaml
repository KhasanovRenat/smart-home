apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smart-home
resources:
  - namespace.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - postgres-deployment.yaml
  - storage-class.yaml
  - monitoring.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policy.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - config/prometheus.yml
      - config/alert.rules.yml
  - name: alertmanager-config
    files: [config/alertmanager.yml]
  - name: grafana-datasources
    files: [config/datasources.yml]
  - name: grafana-dashboards
    files: [config/dashboards.yml]
  - name: grafana-dashboard-json
    files: [config/smart-home.json]
  - name: loki-config
    files: [config/loki.yml]
  - name: alloy-config
    files: [config/config.alloy]
