apiVersion: v1
kind: ServiceAccount
metadata: {name: smart-home-vault, namespace: smart-home}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata: {name: lab-vault, namespace: smart-home}
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata: {name: smart-home, namespace: smart-home}
spec:
  vaultConnectionRef: lab-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: smart-home
    audiences: [vault]
    serviceAccount: smart-home-vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata: {name: smart-home, namespace: smart-home}
spec:
  vaultAuthRef: smart-home
  mount: secret
  type: kv-v2
  path: smart-home
  refreshAfter: 1m
  destination: {name: smart-home-secrets, create: true}
