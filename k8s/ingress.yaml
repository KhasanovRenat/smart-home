apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-home
spec:
  ingressClassName: traefik
  rules:
    - host: smart-home.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {number: 8000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 3000}
